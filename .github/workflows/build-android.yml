name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: U-Station build record id
        required: false
      target_url:
        description: H5 target URL
        required: true
      bundle_id:
        description: Android applicationId
        required: true
      app_name:
        description: App display name (ASCII fallback)
        required: true
      app_name_b64:
        description: UTF-8 display name base64 (launcher label)
        required: false
      version_name:
        description: versionName
        required: true
      version_code:
        description: versionCode
        required: true
      platform_url:
        description: U-Station API base (for assets + webhook)
        required: true
      callback_token:
        description: app_builder callback token
        required: true
      icon_url:
        description: optional icon path/url
        required: false
      splash_url:
        description: optional splash path/url
        required: false
      square_icon_url:
        description: optional square icon path/url (launcher fallback)
        required: false
      min_sdk:
        description: Android minSdkVersion
        required: false
        default: "24"
      target_sdk:
        description: Android targetSdkVersion
        required: false
        default: "36"
      compile_sdk:
        description: Android compileSdkVersion
        required: false
        default: "36"
      fix_apk:
        description: run fix-apk-installable.py (Manifest/resources.arsc Store)
        required: false
        default: "true"
      sign_v1:
        description: apksigner V1 after zipalign
        required: false
        default: "true"
      sign_v2:
        description: apksigner V2
        required: false
        default: "true"
      sign_v3:
        description: apksigner V3
        required: false
        default: "true"
      verify_apk:
        description: run verify-apk-installable.mjs
        required: false
        default: "true"
      check_production:
        description: strict production verify (SDK/ABI checks)
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Install dependencies
        run: |
          node scripts/ensure-www.mjs
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Apply build config & assets
        env:
          APP_BUILDER_MIN_SDK: ${{ inputs.min_sdk }}
          APP_BUILDER_TARGET_SDK: ${{ inputs.target_sdk }}
          APP_BUILDER_COMPILE_SDK: ${{ inputs.compile_sdk }}
          APP_BUILDER_GRADLE_V1_SIGNING: "false"
          TARGET_URL: ${{ inputs.target_url }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}
          APP_NAME_B64: ${{ inputs.app_name_b64 }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          PLATFORM_URL: ${{ inputs.platform_url }}
          ICON_URL: ${{ inputs.icon_url }}
          SPLASH_URL: ${{ inputs.splash_url }}
          SQUARE_ICON_URL: ${{ inputs.square_icon_url }}
        run: |
          node scripts/apply-build-config.mjs
          node scripts/ensure-bundled-assets.mjs
          node scripts/download-assets.mjs || true

      - name: Capacitor sync Android
        env:
          APP_BUILDER_MIN_SDK: ${{ inputs.min_sdk }}
          APP_BUILDER_TARGET_SDK: ${{ inputs.target_sdk }}
          APP_BUILDER_COMPILE_SDK: ${{ inputs.compile_sdk }}
          APP_BUILDER_GRADLE_V1_SIGNING: "false"
          TARGET_URL: ${{ inputs.target_url }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}
          APP_NAME_B64: ${{ inputs.app_name_b64 }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          PLATFORM_URL: ${{ inputs.platform_url }}
          ICON_URL: ${{ inputs.icon_url }}
          SPLASH_URL: ${{ inputs.splash_url }}
          SQUARE_ICON_URL: ${{ inputs.square_icon_url }}
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradlew
          node scripts/apply-build-config.mjs
          node scripts/patch-strip-cordova.mjs
          node scripts/patch-android-network.mjs
          node scripts/patch-android-webview.mjs
          node scripts/patch-android-gradle-deps.mjs

      - name: Verify redirect-shell & target URL
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: node scripts/verify-android-build.mjs

      - name: Finalize production shell (before Gradle)
        env:
          TARGET_URL: ${{ inputs.target_url }}
          APP_NAME: ${{ inputs.app_name }}
          APP_NAME_B64: ${{ inputs.app_name_b64 }}
          APP_BUILDER_MIN_SDK: ${{ inputs.min_sdk }}
          APP_BUILDER_TARGET_SDK: ${{ inputs.target_sdk }}
          APP_BUILDER_COMPILE_SDK: ${{ inputs.compile_sdk }}
        run: node scripts/finalize-android-production.mjs

      - name: Apply launcher & splash assets
        env:
          TARGET_URL: ${{ inputs.target_url }}
          ICON_URL: ${{ inputs.icon_url }}
          SPLASH_URL: ${{ inputs.splash_url }}
          SQUARE_ICON_URL: ${{ inputs.square_icon_url }}
          PLATFORM_URL: ${{ inputs.platform_url }}
        run: |
          python3 -m pip install --quiet Pillow || pip install --quiet Pillow
          node scripts/ensure-bundled-assets.mjs
          node scripts/download-assets.mjs
          node scripts/apply-android-assets.mjs
          if [ "${{ inputs.check_production }}" = "true" ]; then
            CHECK_PRODUCTION_READY=1 node scripts/verify-android-build.mjs
          else
            node scripts/verify-android-build.mjs
          fi

      - name: Decode keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is empty — run 配置 GitHub in admin"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > release.p12
          test -s release.p12

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_ALIAS_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          ls -la app/build/outputs/apk/release/

      - name: Fix APK installable
        if: inputs.fix_apk == 'true'
        run: |
          python3 scripts/fix-apk-installable.py app/build/outputs/apk/release/app-release-unsigned.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-fixed.apk

      - name: Zipalign & Sign APK
        run: |
          if [ "${{ inputs.fix_apk }}" = "true" ]; then
            IN_APK="app/build/outputs/apk/release/app-release-fixed.apk"
          else
            IN_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          OUT_APK="app/build/outputs/apk/release/app-release-signed.apk"
          zipalign -v 4 "$IN_APK" "$OUT_APK"
          apksigner sign \
            --ks ${{ github.workspace }}/release.p12 \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEYSTORE_ALIAS_PASSWORD }} \
            --ks-key-alias ${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            --v1-signing-enabled ${{ inputs.sign_v1 }} \
            --v2-signing-enabled ${{ inputs.sign_v2 }} \
            --v3-signing-enabled ${{ inputs.sign_v3 }} \
            "$OUT_APK"

      - name: Verify APK
        if: inputs.verify_apk == 'true'
        run: node scripts/verify-apk-installable.mjs app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed.apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk

      - name: Get APK file size
        id: apk
        run: |
          FILE_SIZE=$(stat -c%s android/app/build/outputs/apk/release/app-release-signed.apk)
          echo "size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Notify platform (success)
        if: success()
        env:
          PLATFORM_URL: ${{ inputs.platform_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_PLATFORM: android
          BUILD_STATUS: success
          FILE_SIZE_BYTES: ${{ steps.apk.outputs.size }}
        run: node scripts/notify-platform.mjs || true

      - name: Notify platform (failure)
        if: failure()
        env:
          PLATFORM_URL: ${{ inputs.platform_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_PLATFORM: android
          BUILD_STATUS: failed
          BUILD_ERROR: Android workflow failed
        run: node scripts/notify-platform.mjs || true
